# --- build -----------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

sass:
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - HANDOFF.md
  - tools
  - vendor
  - _to_delete
  - .preview
  - .devcontainer
  - .vscode
  - "*.gem"
  - "*.pptx"
  - "*.key"
